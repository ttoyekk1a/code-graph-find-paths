[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-graph-find-paths"
version = "2.0.0"
description = "You Only Search Once in Code Graph: bounded path search with original edge evidence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.23,<2"]

[project.scripts]
code-graph-find-paths = "code_graph_find_paths.cli:main"

[tool.setuptools]
packages = ["code_graph_find_paths"]
